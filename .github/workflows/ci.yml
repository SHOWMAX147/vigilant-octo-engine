name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 18.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # Node.js + dependency cache (npm)
      # ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Uncomment if your lockfile is not in the root:
          # cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # ──────────────────────────────────────────────
      # Turborepo cache
      # ──────────────────────────────────────────────
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: \( {{ runner.os }}-turbo- \){{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            \( {{ runner.os }}-turbo- \){{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      # ──────────────────────────────────────────────
      # Next.js cache
      # ──────────────────────────────────────────────
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: \( {{ runner.os }}-nextjs- \){{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            \( {{ runner.os }}-nextjs- \){{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # ──────────────────────────────────────────────
      # Docker (BuildKit + GitHub Actions cache)
      # ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tron:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ──────────────────────────────────────────────
      # Upload build artifact
      # ──────────────────────────────────────────────
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: dist/
          if-no-files-found: error
          retention-days: 7